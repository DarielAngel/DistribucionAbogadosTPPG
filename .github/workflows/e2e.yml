name: E2E Tests

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '9'
          run_install: false

      - name: Install backend dependencies
        run: pnpm -C backend install

      - name: Install frontend dependencies
        run: pnpm -C frontend install

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps

      - name: Start backend
        working-directory: backend
        run: pnpm run dev > backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:4000/api
        run: pnpm run dev > frontend.log 2>&1 &

      - name: Wait for services
        run: npx wait-on --timeout 120000 tcp:127.0.0.1:5173 tcp:127.0.0.1:4000

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:4000/api
        run: pnpm exec playwright test --reporter=list

      - name: Print Service Logs on Failure
        if: failure()
        run: |
          cat backend/backend.log || true
          cat frontend/frontend.log || true