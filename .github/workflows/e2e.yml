name: E2E Tests

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '9'
          run_install: false

      - name: Install backend dependencies
        run: pnpm -C backend install

      - name: Install frontend dependencies
        run: pnpm -C frontend install

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps

      - name: Start backend
        working-directory: backend
        run: pnpm run dev &

      - name: Start frontend
        working-directory: frontend
        run: pnpm run dev &

      - name: Wait for services
        run: npx wait-on http://localhost:5173 && npx wait-on http://localhost:4000/api/lawyers

      - name: Run Playwright E2E
        working-directory: frontend
        run: pnpm exec playwright test --reporter=list
