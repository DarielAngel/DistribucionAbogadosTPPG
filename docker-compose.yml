version: '3.8'

# SECURITY NOTE: Copy this file to .env.local and set secure values before production deployment.
# See .env.example for complete variable documentation.

services:
  backend:
    build: ./backend
    environment:
      # Security and execution environment
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      # Database configuration (use managed DB service in production, not SQLite)
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/database.sqlite}
      # JWT secret - MUST be set to a strong random value in production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-openssl-rand}
      # CORS frontend URL - must match your production domain
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Admin tools IP whitelist - restrict to trusted admin networks/VPNs only
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    # Do NOT expose port 4000 publicly - only nginx should access it
    expose:
      - "4000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/auth/me', (r) => {if (r.statusCode !== 401) throw new Error(r.statusCode)}); "]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      # Frontend API endpoint (can be overridden at build time)
      VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      # HTTP port (set PORT env var for custom port, default 80)
      - "${PORT:-80}:80"
      # Uncomment for HTTPS (requires TLS cert in nginx.conf)
      # - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  db_data:
    driver: local
